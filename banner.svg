<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#24243e"/>
      <stop offset="1" stop-color="#4a1e64"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2fd0"/>
      <stop offset="0.4" stop-color="#a45cff"/>
      <stop offset="0.75" stop-color="#3f8cff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#a45cff"/>
      <stop offset="1" stop-color="#ff2fd0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="892" height="212" rx="18" fill="url(#bg)"/>
  <rect x="4" y="4" width="892" height="212" rx="18" fill="none" stroke="url(#edge)" stroke-width="4"/>

  <text x="450" y="128" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="78" font-weight="800"
        font-style="italic" text-anchor="middle" fill="url(#txt)" letter-spacing="4" filter="url(#glow)">EXO CLIENT</text>

  <line x1="150" y1="92" x2="310" y2="92" stroke="url(#edge)" stroke-width="2" opacity="0.6"/>
  <line x1="590" y1="92" x2="750" y2="92" stroke="url(#edge)" stroke-width="2" opacity="0.6"/>
  <circle cx="140" cy="92" r="4" fill="#ff2fd0"/>
  <circle cx="760" cy="92" r="4" fill="#00e5ff"/>

  <text x="450" y="172" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20"
        text-anchor="middle" fill="#9bf6ff" letter-spacing="12">&#9670; &#9670; &#9670;</text>
</svg>
